name: Check Wi-Fi Package Manager
on:
  push:
    branches: [main, kem-vpn-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies
        run: npm install --prefix membership
      - name: Check JavaScript syntax
        run: |
          node --check membership/src/server.js
          node --check membership/public/app.js
          node --check membership/public/admin.js
          node --check membership/public/sw.js
      - name: Verify VPN code is not part of the Wi-Fi API
        run: |
          ! grep -Eiq 'wireguard|WireGuard' membership/src/server.js
          test -f membership/public/manifest.webmanifest
          test -f membership/public/sw.js
