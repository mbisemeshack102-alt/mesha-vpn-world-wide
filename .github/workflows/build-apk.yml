name: Check Wi-Fi Package Manager
on:
  push:
    branches: [main, kem-vpn-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check membership/src/server.js
          node --check membership/public/app.js
          node --check membership/public/admin.js
      - name: Install API dependencies and run package tests
        run: |
          npm install --prefix membership
          npm test --prefix membership
