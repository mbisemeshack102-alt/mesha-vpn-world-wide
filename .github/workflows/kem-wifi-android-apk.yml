name: KEM WIFI PRO SECURE Android APK
on:
  push:
    branches: [kem-vpn-foundation]
    paths:
      - "membership/public/**"
      - "android-wrapper/**"
      - ".github/workflows/kem-wifi-android-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare Capacitor Android project
        working-directory: android-wrapper
        run: |
          mkdir -p www
          cp -R ../membership/public/. www/
          npm init -y
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android
      - name: Build installable debug APK
        working-directory: android-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KEM-WIFI-PRO-SECURE-Android-debug-APK
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
