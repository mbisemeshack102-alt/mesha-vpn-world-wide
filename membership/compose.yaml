services:
  wifi-manager-api:
    build: .
    container_name: wifi-manager-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8080
      DATABASE_FILE: /app/data/wifi-manager.sqlite
      TRUST_PROXY_HOPS: 1
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - wifi_manager_data:/app/data
    security_opt:
      - no-new-privileges:true

volumes:
  wifi_manager_data:
